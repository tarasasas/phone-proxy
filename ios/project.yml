# XcodeGen spec: `xcodegen generate` turns this into PhoneProxy.xcodeproj.
# The CI workflow does that on a macOS runner, so no .xcodeproj is committed.
name: PhoneProxy
options:
  bundleIdPrefix: com.tarasasas
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhoneProxy:
    type: application
    platform: iOS
    sources:
      - PhoneProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarasasas.phoneproxy
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Phone Proxy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - location
        NSLocalNetworkUsageDescription: Phone Proxy accepts connections from your computer on the local network.
        NSLocationWhenInUseUsageDescription: Location updates keep the proxy running while the app is in the background. Your location is not stored or sent anywhere.
        NSLocationAlwaysAndWhenInUseUsageDescription: Location updates keep the proxy running while the app is in the background. Your location is not stored or sent anywhere.
schemes:
  PhoneProxy:
    build:
      targets:
        PhoneProxy: all
