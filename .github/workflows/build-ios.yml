name: Build iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneProxy.app Payload/
          # Ad-hoc sign so the binary already has a code-signature slot;
          # sideloaders (Sideloadly, AltStore) then just replace it.
          codesign --force --sign - --timestamp=none Payload/PhoneProxy.app
          codesign -dvv Payload/PhoneProxy.app
          lipo -info Payload/PhoneProxy.app/PhoneProxy
          zip -qry PhoneProxy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-ipa
          path: ios/PhoneProxy.ipa
          if-no-files-found: error
